<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cascade Pop</title>
<meta name="description" content="Cascade Pop – tap groups of matching gems, build bombs and line blasts, and beat every level. Free puzzle game, no download.">
<!--PLATFORM_SDK-->
<style>
:root{--bg:#141826;--panel:#1e2438;--text:#eef1ff;--muted:#9aa3c7;--accent:#ffcf4a;--good:#5ee07a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at top,#26305a 0%,var(--bg) 60%);color:var(--text);font:600 16px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;touch-action:none}
#app{display:flex;flex-direction:column;height:100%;max-width:620px;margin:0 auto;padding:10px 10px 12px}
#hud{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;margin-bottom:10px}
.pill{background:var(--panel);border-radius:12px;padding:6px 10px;text-align:center;min-width:58px}
.pill small{display:block;color:var(--muted);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase}
.pill b{font-size:1.15rem}
#bar{position:relative;height:34px;background:var(--panel);border-radius:12px;overflow:hidden}
#fill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#ff7a59,var(--accent));transition:width .35s}
#bartext{position:relative;display:flex;justify-content:center;align-items:center;height:100%;font-size:.95rem;text-shadow:0 1px 2px #0008}
#mute{background:var(--panel);border:0;color:var(--text);border-radius:12px;width:44px;height:44px;font-size:1.2rem;cursor:pointer}
#area{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
canvas{display:block;border-radius:16px;background:#0f1322;box-shadow:0 10px 40px #0008;touch-action:none}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0e1acc;backdrop-filter:blur(4px);z-index:5;padding:16px}
.overlay[hidden]{display:none}
.card{background:var(--panel);border-radius:20px;padding:26px 22px;max-width:360px;width:100%;text-align:center;box-shadow:0 20px 60px #000a;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.card h1{margin:0 0 6px;font-size:2.2rem;background:linear-gradient(90deg,#ff7a59,var(--accent),#5ee0d6);-webkit-background-clip:text;background-clip:text;color:transparent}
.card h2{margin:0 0 8px;font-size:1.6rem}
.card p{color:var(--muted);margin:6px 0 14px;font-weight:500}
.stars{font-size:2.4rem;letter-spacing:6px;margin:6px 0;color:var(--accent);text-shadow:0 2px 10px #ffb62755}
.stars .off{opacity:.2}
.btn{display:block;width:100%;margin-top:10px;padding:14px;border:0;border-radius:14px;font:800 1.1rem system-ui,sans-serif;cursor:pointer;background:linear-gradient(180deg,#ffd866,#ffb21e);color:#3a2500;box-shadow:0 4px 0 #b97a00}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b97a00}
.btn.alt{background:#2c3454;color:var(--text);box-shadow:0 4px 0 #161b2e}
.how{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;text-align:left;font-size:.88rem;color:var(--muted);font-weight:500;margin:12px 0}
.how b{color:var(--text)}
#toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:#000c;padding:10px 18px;border-radius:12px;font-size:1.1rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:4}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="pill"><small>Level</small><b id="lvl">1</b></div>
    <div id="bar"><div id="fill"></div><div id="bartext">0 / 0</div></div>
    <div class="pill"><small>Moves</small><b id="moves">20</b></div>
    <button id="mute" aria-label="Toggle sound">🔊</button>
  </div>
  <div id="area"><canvas id="board"></canvas></div>
</div>
<div id="ov" class="overlay"><div class="card" id="card"></div></div>
<div id="toast"></div>
<script src="core.js"></script>
<script src="game.js"></script>
</body>
</html>
